name: Security checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Static syntax and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check ollama.js
          node --check prompts.js

      - name: Run test suite
        run: |
          node --test tests/cumplo.test.mjs

      - name: Compile Python files
        run: |
          python -m py_compile server.py

      - name: Run Bandit
        run: |
          bandit -r . -x ./.git,./dist,./build,./__pycache__ -ll

      - name: Check local server hardening (Host, dotfiles)
        run: |
          python server.py --port 18765 > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:18765/index.html && break
            sleep 0.5
          done
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          expect() {
            if [ "$1" != "$2" ]; then echo "FAIL: $3 -> $1 (expected $2)"; cat server.log; exit 1; fi
            echo "ok: $3 -> $1"
          }
          expect "$(code http://127.0.0.1:18765/index.html)" 200 "GET with local Host"
          expect "$(code http://127.0.0.1:18765/app.js)" 200 "regular static file"
          expect "$(code -H 'Host: evil.example' http://127.0.0.1:18765/index.html)" 421 "GET with foreign Host"
          expect "$(code -I -H 'Host: evil.example' http://127.0.0.1:18765/index.html)" 421 "HEAD with foreign Host"
          expect "$(code http://127.0.0.1:18765/.git/config)" 404 "dotfile path"
          expect "$(code http://127.0.0.1:18765/%2egit/config)" 404 "dotfile path, percent-encoded"
          expect "$(code http://127.0.0.1:18765/%2Egit/HEAD)" 404 "dotfile path, percent-encoded uppercase"
          expect "$(code http://127.0.0.1:18765/%2egitignore)" 404 "dotfile file, percent-encoded"
          expect "$(code http://127.0.0.1:18765/assets/%2e%2e/%2egit/config)" 404 "dotfile path, encoded traversal"
          expect "$(code http://127.0.0.1:18765/assets/)" 404 "directory listing disabled"
          kill "$SERVER_PID" || true

      - name: Check unwanted external references
        run: |
          TERM_A="$(printf '\x67\x6f\x62\x6c\x69\x6e')"
          TERM_B="$(printf '\x4d\x61\x67\x69\x63\x20\x54\x6f\x44\x6f')"
          HOST_A="${TERM_A}$(printf '\x2e\x74\x6f\x6f\x6c\x73')"
          PATTERN="${TERM_A}|${TERM_B}|${HOST_A}"

          if git grep -nEI -e "$PATTERN" -- .; then
            echo "Unwanted external reference found."
            exit 1
          fi

      - name: Check unwanted committed files
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|\.env$|.*\.log$|.*\.pyc$|\.DS_Store$|Thumbs\.db$)'; then
            echo "Unwanted committed file found."
            exit 1
          fi

      - name: Check high-confidence committed secrets
        run: |
          if git grep -nEI -e "-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----" -- .; then
            echo "Private key material found."
            exit 1
          fi

          if git grep -nEI -e "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|sk-[A-Za-z0-9]{20,})" -- .; then
            echo "High-confidence credential-like string found."
            exit 1
          fi
