name: Security checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Static syntax and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check ollama.js
          node --check prompts.js

      - name: Run test suite
        run: |
          node --test tests/cumplo.test.mjs

      - name: Compile Python files
        run: |
          python -m py_compile server.py

      - name: Run Bandit
        run: |
          bandit -r . -x ./.git,./dist,./build,./__pycache__ -ll

      - name: Check unwanted external references
        run: |
          TERM_A="$(printf '\x67\x6f\x62\x6c\x69\x6e')"
          TERM_B="$(printf '\x4d\x61\x67\x69\x63\x20\x54\x6f\x44\x6f')"
          HOST_A="${TERM_A}$(printf '\x2e\x74\x6f\x6f\x6c\x73')"
          PATTERN="${TERM_A}|${TERM_B}|${HOST_A}"

          if git grep -nEI -e "$PATTERN" -- .; then
            echo "Unwanted external reference found."
            exit 1
          fi

      - name: Check unwanted committed files
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|\.env$|.*\.log$|.*\.pyc$|\.DS_Store$|Thumbs\.db$)'; then
            echo "Unwanted committed file found."
            exit 1
          fi

      - name: Check high-confidence committed secrets
        run: |
          if git grep -nEI -e "-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----" -- .; then
            echo "Private key material found."
            exit 1
          fi

          if git grep -nEI -e "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|sk-[A-Za-z0-9]{20,})" -- .; then
            echo "High-confidence credential-like string found."
            exit 1
          fi
