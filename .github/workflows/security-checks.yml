name: Security checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Static syntax and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check ollama.js
          node --check prompts.js

      - name: Compile Python files
        run: |
          python -m py_compile server.py

      - name: Run Bandit
        run: |
          bandit -r . -x ./.git,./dist,./build,./__pycache__ -ll

      - name: Check forbidden references
        run: |
          if git grep -nEI "goblin|Magic ToDo|goblin\.tools" -- .; then
            echo "Forbidden reference found."
            exit 1
          fi

      - name: Check unwanted committed files
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__|\.env$|.*\.log$|.*\.pyc$|\.DS_Store$|Thumbs\.db$)'; then
            echo "Unwanted committed files found."
            exit 1
          fi

      - name: Check high-confidence committed secrets
        run: |
          if git grep -nEI "-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----" -- .; then
            echo "Private key material found."
            exit 1
          fi

          if git grep -nEI "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|sk-[A-Za-z0-9]{20,})" -- .; then
            echo "High-confidence credential-like string found."
            exit 1
          fi
