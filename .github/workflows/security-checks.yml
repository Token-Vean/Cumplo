name: Security checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static syntax and security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Compile Python files
        run: |
          python -m py_compile server.py

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check ollama.js
          node --check prompts.js

      - name: Run Bandit
        run: |
          bandit -r . -x ./.git,./dist,./build,./.github -ll

      - name: Check unwanted local files
        run: |
          if find . \( \
            -name ".env" -o \
            -name "*.log" -o \
            -name "__pycache__" -o \
            -name "*.pyc" -o \
            -name ".DS_Store" -o \
            -name "Thumbs.db" \
          \) | grep .; then
            echo "Unwanted local files found."
            exit 1
          fi

      - name: Check for possible secrets
        run: |
          if grep -RInE "(api[_-]?key|secret|password|access[_-]?token|auth[_-]?token|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY)" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=dist \
            --exclude-dir=build; then
            echo "Possible secret-like string found. Review manually."
            exit 1
          fi

      - name: Check forbidden external references
        run: |
          if grep -RInE "go[b]lin|Magic[[:space:]]ToDo|go[b]lin\.tools" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=dist \
            --exclude-dir=build; then
            echo "Forbidden reference found."
            exit 1
          fi
